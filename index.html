const CHRON={military:{"title": "The Long Cold War", "voice": "As set down in the war-chronicle of the hive", "ev": {"The Bill": [{"s": "The Thal sent their bill, and the Sovereign paid it in full. The border quieted, and Mor filed the payment under weakness."}, {"s": "The Sovereign's analysts picked the Thal invoice apart line by line, and Hegemon Marrane never forgave the joke."}, {"s": "The Sovereign refused the Thal bill on the steps of their own capital, and the brood-halls roared.", "f": "The Sovereign went to refuse the Thal bill in person and came home bruised, with Dreth's fleet already moving."}], "The Border Buildup": [{"s": "When the Thal massed on the border, the Sovereign matched them hull for hull and paid in hatchlings."}, {"s": "The Sovereign offered the Thal a joint patrol. It held for three weeks, until someone in Marrane's court recalled their captain."}, {"s": "The Sovereign flew the border alone and found the gap at Kessar Reach.", "f": "Thal pickets shot up the Sovereign's recon run, and fifty more of Mor's ships came to the line."}], "The Defector": [{"s": "The Sovereign gave asylum to Dr. Imra Sohl, and the Thal branded her family enemies of the Hegemony."}, {"s": "The Sovereign sent Imra Sohl home. She was not seen again."}, {"s": "The Sovereign debriefed Imra Sohl at the border and sent her home to her family.", "f": "The Sovereign debriefed Imra Sohl at the border under sniper fire and sent her home."}], "The Hostages": [{"s": "The Sovereign brought Imra Sohl's family out of Thal space alive.", "f": "The Sovereign tried to rescue Imra Sohl's family and failed, and Sohl went back across the border alone to free them."}, {"s": "The Sovereign would not send agents for Imra Sohl's family, so she went back for them herself."}], "Fuel Embargo": [{"s": "When the Thal cut off fuel, the Sovereign built plants on three moons and broke Marrane's lever for good."}, {"s": "The Sovereign signed a fuel quota, and from then on each side knew how long the other could fight."}, {"s": "The Sovereign answered the embargo with a blockade. Two captains locked weapons, held fire, and were both decorated."}], "The Embassy Fire": [{"s": "When the Thal embassy burned, the Sovereign's crews brought every soul out alive."}, {"s": "The Sovereign investigated the embassy fire and found a fuel cell where a candle should have been."}, {"s": "The Sovereign carried Ambassador Tamar out of the burning embassy with their own hands.", "f": "The Sovereign carried Ambassador Tamar from the fire and spent nine days in a sealed ward for it."}], "Stolen Shield Codes": [{"s": "When the shield codes were stolen, the Sovereign had every one rewritten by dawn."}, {"s": "The Sovereign fed the Thal false shield codes and learned how Mor would attack."}, {"s": "The Sovereign caught the code thief and found the hand that paid him inside their own court.", "f": "The code thief escaped the Sovereign, and Marrane called the chase an attempt on a Thal life."}], "The Thal Election": [{"s": "The Sovereign quietly backed Hegemon Marrane, who held her throne against Speaker Vael and opened talks."}, {"s": "The Sovereign stayed out of the Thal election, and Marrane held it against Vael by a whisker."}, {"s": "The Sovereign funded Speaker Vael, who nearly won, and Marrane kept her throne only by turning hawk and taking up Vael's war."}], "The Prototype": [{"s": "The Sovereign tested the new weapon slowly, and it worked."}, {"s": "The Sovereign shared the prototype with the Thal, and three of their warships were never built."}, {"s": "The Sovereign flew the prototype in person and set the pace of the arms race.", "f": "The prototype exploded under the Sovereign, and Marrane answered with a test closer to the border."}], "The Ultimatum": [{"s": "When Marrane issued her ultimatum, every Vorrani fleet lit its engines, and for six hours no one on either side breathed."}, {"s": "The Sovereign answered the ultimatum with a summit and shared a table with Marrane while her fleets kept moving."}, {"s": "The Sovereign answered the ultimatum with a demonstration, and Mor rewrote a war plan ten years old."}], "The Last Ledger": [{"s": "At the last, the Sovereign signed the peace the Thal had written, and Dreth kept the fleet ready anyway."}, {"s": "At the last, the Sovereign's envoys rewrote the treaty line by line, and Mor walked out of the talks."}, {"s": "At the last, the Sovereign boarded Marrane's flagship alone, and Mor saluted them goodbye.", "f": "At the last, the Sovereign boarded Marrane's flagship alone and came home bruised, carrying her offer of a ceasefire."}], "The Mothball Fleet": [{"s": "The Sovereign seized three hundred sleeping Thal ships, and Mor was ordered to take them back."}, {"s": "The Sovereign walked the bridge of a sleeping Thal flagship and stole Mor's old war plans.", "f": "The Sovereign boarded the sleeping Thal fleet, and Commander Ivek woke it."}, {"s": "The Sovereign let the Thal ghost fleet sleep and watched it, until the Thal began to watch it too."}], "Old Comrades": [{"s": "The Sovereign drank with old Thal comrades and learned which generals would refuse to fire.", "f": "The Sovereign's reunion with old Thal comrades ended under artillery, and two of Harro's soldiers died."}, {"s": "The Sovereign sent medals to old Thal comrades, and half the garrisons hid them from Marrane."}, {"s": "The Sovereign took in Thal veterans who knew where Mor would strike, and Dreth moved his flag to meet him."}], "The Assassin's Apprentice": [{"s": "The Sovereign questioned the assassin Sei, and three of Marrane's ministers fell.", "f": "The Sovereign questioned the assassin Sei, was poisoned, and never learned who silenced her."}, {"s": "The Sovereign traced every Thal paymaster back to one office in Marrane's palace."}, {"s": "The Sovereign sent the assassin Sei home, and Marrane made her a teacher."}], "The Nebula Race": [{"s": "The Sovereign raced Admiral Venn through the Vel Nebula, won by half a hull, and heard a Thal officer laugh.", "f": "The Sovereign crashed racing Admiral Venn, and she pulled them from the wreck at the cost of her standing."}, {"s": "The Sovereign's pilot beat Admiral Venn through the Vel Nebula, and Venn was posted away."}, {"s": "The Sovereign declined Venn's race and charted a place to hide a fleet."}], "Song for the Hegemon": [{"s": "The Sovereign sent the war-choir to Marrane's court, and the Hegemon heard what a war would cost."}, {"s": "The Sovereign sang before the Hegemon, and her guards lowered their rifles.", "f": "The Sovereign sang before the Hegemon, Thal hardliners opened fire, and Mor set the shooter free."}, {"s": "The Sovereign showed the Thal court fleet drills instead of a song, and the border watch doubled by nightfall."}], "The Census": [{"s": "The Sovereign answered the Thal census with a photograph of every family it had left out."}, {"s": "The Sovereign parked warships over the disputed worlds, and Mor's fleet came to stare back."}, {"s": "The Sovereign's hackers rewrote the Thal census, and Mor took his fleet orders off the network."}], "The Last Safehouses": [{"s": "Spymaster Tav pulled Dr. Imra Sohl out of Thal space in a grain freighter, and she went to work that night.", "f": "Spymaster Tav tried to pull Dr. Imra Sohl out of Thal space. The freighter was stopped at the line."}, {"s": "Spymaster Tav brought Sei across the border, and eleven Thal agents were taken before dinner.", "f": "Spymaster Tav tried to bring Sei across the border. She drew the guards away, and did not come back."}, {"s": "In one night, Spymaster Tav took both Sohl and Sei out of Thal space.", "f": "In one night, Spymaster Tav tried for both Sohl and Sei, and came home with neither."}, {"s": "Spymaster Tav folded the map of the safehouses, and the Sovereign let the pins stay where they were."}], "The Drifting Cruiser": [{"s": "The Sovereign towed a crippled Thal cruiser home, and Mor sent back the burial cloth folded."}, {"s": "The Sovereign boarded a drifting Thal cruiser and took Mor's own chart of the Vel Nebula.", "f": "The Sovereign boarded a drifting Thal cruiser, and its reactor took the ship and its log."}, {"s": "The Sovereign held a crippled Thal cruiser at gunpoint for nine hours, and a Thal gunner's slip went unanswered."}], "The Blackout Schedule": [{"s": "The Sovereign kept the yards burning, and the west brood-halls went dark on alternate nights."}, {"s": "The Sovereign closed one yard in three, and Marrane answered by closing one in four."}, {"s": "The Sovereign rebuilt the grid, and a month later the Thal blackouts ended on the same design."}], "The Private Line": [{"s": "The Sovereign took Marrane's private line and told no one, not even Tav."}, {"s": "The Sovereign took Marrane's private line and had every pause written down."}, {"s": "The Sovereign handed Marrane's secret line to the war council, and Mor had it within a week."}], "The Rehearsal": [{"s": "The Sovereign answered Mor's war game turn for turn, and both empires' yards ordered more hulls."}, {"s": "The Sovereign logged Mor's war game and saw Kessar Reach left open for an hour."}, {"s": "The Sovereign watched Mor rehearse the invasion of the homeworld from his own bridge.", "f": "The Sovereign watched Mor's war game from his bridge and was carried off it bleeding."}], "The Thal Quarter": [{"s": "The Sovereign emptied the Thal quarter into clean camps, and Marrane emptied the hive's quarter in return."}, {"s": "The Sovereign walked the Thal quarter and bought spice from Teo Hass, and the crowd went home.", "f": "The Sovereign walked the Thal quarter and took a stone meant for Teo Hass."}, {"s": "The Sovereign set the Thal quarter to reading Thal news, and their families paid for it."}]}, "end": {"win": {"military": "The long cold war ended the way the hive had always said it would: in fire. Grand Admiral Mor's fleet broke in the Vel Nebula, and Mor went down with his flagship. Then the hive's lances turned on the Thal homeworld, and its cities went dark one by one. Marshal Dreth gave that order himself, so that it would not carry the Sovereign's name. Hegemon Marrane signed on the third day and did not look up from the page. The brood-halls sang for forty days, and the chroniclers note that the Sovereign did not sing.", "influence": "The war both empires had built for never came. Hegemon Marrane signed the Sovereign's federation charter before her whole Assembly, and not one shot was fired. Grand Admiral Mor resigned his commission that afternoon and left the palace on foot. Marshal Dreth called it surrender. Broodmother Ysk closed her ledger of hatchlings sent to the line and did not open a new one.", "science": "In the end, no shot was fired. The Sovereign's forges pulled so far ahead that the Hegemony stopped building warships. Mor, who knew fleets better than anyone alive, was the one who told Marrane there was no war left to win. One by one the Thal border yards went dark. The hive remembers it as the year the war-choirs had nothing to sing about, and were glad."}, "loss": {"military": "The fleets met at last, and it was Mor who found the gap at Kessar Reach. The hive's fleet died there, and for eleven days the Thal lances fell on the homeworld and answered every Vorrani song. When they stopped, a Hegemony clerk arrived with peace terms. Marshal Dreth and Spymaster Tav were among the dead, and so were her grandchildren Kel and Ama. Broodmother Ysk read the names aloud until her voice gave out, and then she signed. The cold war was over. Only one side had learned its price.", "influence": "The Thal sent the Sovereign's federation charter back unsigned, with no reason given. By nightfall Grand Admiral Mor's fleets were massing on the border, and the hive's envoys were still packing. Marshal Dreth did not say he had warned them. He did not need to. The chronicle leaves its last page blank, because what began that night is not over.", "science": "The Thal answered the Sovereign's edge with a sharper one. They cracked the hive's shield in a single night, and the flagship went dark mid-transmission. Spymaster Tav had counted Thal shipyards every night for years; he had counted the wrong ones. By morning a Hegemony clerk had come to annex what was left. The race the Sovereign started had a finish line after all, and the Thal crossed it first."}, "dead": "The Sovereign died in the act of choosing, as the hive's rulers have always hoped to. Without them, the court split between Dreth's war and Ysk's caution, and the throne room stood empty while they argued. Hegemon Marrane did not wait for the argument to end. The chronicle stops here, mid-page, as the reign did.", "coup": "The Sovereign fell to the hive, not to the Thal. Worn thin by a war that never came, the guards opened the throne room doors and stood aside. Across the border, Marrane watched the broadcast without a word, then sent Mor's fleets forward. Some say she was sorry. The chroniclers do not."}, "lean": {"influence": "The chronicle records, too, that this warrior Sovereign learned late to reach for words before blades. The hive still argues whether that was weakness or the hardest kind of strength.", "science": "The chronicle records, too, that the forges burned hotter than the war-halls that year, and that the Sovereign came to trust what could be measured over what could be sworn."}, "fate": {"win": {"sohl": "Dr. Imra Sohl, whom the hive had not saved, died in the fire on the Thal homeworld. The safehouse where she hid was on no target list, and it burned anyway.", "sei": "Sei, the young assassin the hive never won over, died on the Thal homeworld when the lances came. Spymaster Tav closed her file that night.", "sohl_asy": "Dr. Imra Sohl went back across the border alone to free her family. Tav's map put her in a lavender safehouse in the Thal capital. It was on no target list, and the lances found it anyway.", "sohl_safe": "Dr. Imra Sohl watched the broadcast from a hive laboratory, safe, and turned it off before the end. The next morning she went back to work.", "sei_safe": "Sei lived out the war on the hive's side of the border. She never spoke of the world she had been trained to die for."}, "loss": {"sohl": "Dr. Imra Sohl had found shelter in the hive, but the hive could not shelter her at the last. She died when the Thal lances fell on the homeworld, among the people who had taken her in.", "sei": "Sei had been spared and kept safe on the hive's homeworld. When the Thal bombardment came, her own people's guns found her too."}}}};

function achEnd(win,wasDlc,CR,title){const fin=LASTFIN;LASTFIN=null;if(TUT){ach('tut');return}if(!win){ach('lose');if(title==='Coup')ach('coup');if(title==='The Line Ends'||title==='Fallen Sovereign')ach('died');return}
 if(!wasDlc){ach('first');ach({Easy:'easy',Normal:'normal',Hard:'hard'}[emp.diff]);if(!RUNA.pc&&!(fin&&fin.front))ach('throne');ach({veteran:'vet',survivor:'surv',daring:'daring'}[trait.id]);if(timedOn())ach('timed');if(threat<=4)ach('thalcalm');if(threat<=0)ach('thal0');if(winsOf('main')>=10)ach('tenwins');if(fin&&!fin.front&&fin.p!=null)ach('rear');const g=achGot();if(g.easy&&g.normal&&g.hard)ach('all3')}
 else{ach('dlc');if(['Easy','Normal','Hard'].every(d=>winsOf('dlc',d)>=1))ach('dlcall');if(CR&&CR.bonus){ach('chain');if(emp.diff==='Hard')ach('hardchain')}}
 if(RUNA.pc>=4&&!RUNA.pf)ach('flawless');if(RUNA.reboot)ach('reboot');if(aug)ach('aug');
 if(fin&&fin.q)ach('quantum');if(fin&&fin.p===fin.need)ach('razor');if(fin&&fin.p>=25)ach('bigwin');if(RUNA.bo)ach('dark');if((RUNA.hc||0)>=2)ach('scarred')}
let lastDlc=false;
function replay(win){document.getElementById('arenaBox').innerHTML=lastDlc?arenaDLC(win,route):arena(win,route)}
const REVEAL={military:4800,influence:4400,science:4200};
let endToken=0;
function end(win,title,msg,fight){if(!TUT)shopStamp(title);else SHOPHINT_P=null;
 if(TUT)return tutFinish(win,title,msg);
 clearSave();
 const before=header();
 const wasDlc=dlc;let CR=null;if(!TUT){if(!wasDlc)record(emp.diff,win);lifeRecord(wasDlc,emp&&emp.diff,win);CR=awardCredits(wasDlc,emp&&emp.diff,win)}
 const unlock=win&&!wasDlc&&title==='Victory'&&!TUT;dlc=false;
 achEnd(win,wasDlc,CR,title);
 const dlcThreat=wasDlc?(win?0:10):null; // the campaign settles the Thal for good: 0/10 on a win, 10/10 on a loss
 const grave=!!fight&&wasDlc&&route==='military'&&!TUT; // only the two final-battle titles, never The Line Ends / Coup / Fallen Sovereign
 const result=`<div class="stampban ${grave?'grave '+(win?'gw':'gl'):win?'sw':'sl'}">${title}</div><p${grave?' class="gp"':''}>${msg}</p>${(CHRON_NEXT=wasDlc&&!TUT&&!!chronBtn(win,title))?'':''}${CR&&CR.n?`<p class="credline">+${CR.n} credits${CR.bonus?` and a +${CR.bonus} back-to-back bonus`:''} ${CR.r?` and +${CR.r} renown for your general`:''} for Systems. You now have ${credits()} credits${CR.r?` and ${renownPts()} renown`:''}.</p>`:''}${unlock?`<button class="personal" style="text-align:center" onclick="dlcGate()">DLC: The Thal Reckoning<small>${DLC_TURNS} more turns to deal with the Thal for good, using your ${LABELS[route]}. Your empire carries over.</small>${dlcCredLine(emp.diff)}</button>`:''}${TUT?`<p class="note">Tutorial complete. Real runs are saved, count on the scoreboard and, after a victory, unlock the DLC.</p>`:''}${CHRON_NEXT?`<button class="personal" style="text-align:center" onclick="showChronPage()">Next: the chronicle<small>${CHRON[storyKey()].title}, as your choices wrote it.</small></button>`:`<button style="text-align:center" onclick="start()">${TUT?'Play for real':'Play again'}</button>`}`;
 if(!fight){if(dlcThreat!==null)threat=dlcThreat;app.innerHTML=header()+(wasDlc||TUT?'':recBox(emp.diff))+`<div class="card" style="text-align:center">${result}</div>`+logBox();return}
 const tok=++endToken;
 app.innerHTML=`<div id="hdr">${before}</div><div class="card" style="text-align:center"><div id="arenaBox">${(lastDlc=wasDlc)?arenaDLC(win,route):arena(win,route)}</div><div id="resSlot"><p class="note suspense">The battle rages.</p></div></div><div id="recSlot"></div>`;
 const reveal=()=>{document.querySelectorAll('.skipanim').forEach(b=>b.remove());if(tok!==endToken||!document.getElementById('resSlot'))return;
  if(dlcThreat!==null)threat=dlcThreat;
  document.getElementById('hdr').innerHTML=header();
  if(dlcThreat!==null){const pl=[...document.querySelectorAll('#hdr .pill')].find(x=>x.textContent.includes('Thal Threat'));if(pl)pl.classList.add('pillflash')}
  document.getElementById('recSlot').innerHTML=wasDlc||TUT?'':recBox(emp.diff);
  document.getElementById('resSlot').innerHTML=`<div class="reveal">${result}</div><button class="rs" style="float:none;margin:10px auto 0;display:block" onclick="replay(${win})">Replay battle</button>`;
  document.getElementById('recSlot').insertAdjacentHTML('afterend',logBox());
 };
 REVEAL_FN=reveal;clearTimeout(REVEAL_T);REVEAL_T=setTimeout(()=>{REVEAL_FN=null;reveal()},wasDlc?(route==='military'?600000:(win&&route==='influence'?7400:4800)):(win&&route==='influence'?6800:(REVEAL[route]||2500)));
}

// hand-drawn sky + boiling outlines
(function(){
 let seed=42;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 let st='';for(let i=0;i<90;i++){const x=rnd()*100,y=rnd()*100,r=(rnd()*1.3+.4).toFixed(2),o=(rnd()*.6+.25).toFixed(2);st+=`<circle cx="${x.toFixed(1)}%" cy="${y.toFixed(1)}%" r="${r}" fill="#f2e8cf" opacity="${o}"/>`}
 let sp='';for(let i=0;i<7;i++){const x=rnd()*100,y=rnd()*100,k=(rnd()*4+3).toFixed(1);sp+=`<svg x="${x.toFixed(1)}%" y="${y.toFixed(1)}%" overflow="visible"><path d="M0 -${k} Q0 0 ${k} 0 Q0 0 0 ${k} Q0 0 -${k} 0 Q0 0 0 -${k}" fill="#f2b134" opacity=".8"/></svg>`}
 let neb='';const blobs=[[18,22,46,'#3a2a6e',.35],[78,30,40,'#1f5a6e',.28],[60,78,55,'#5b2a5e',.22],[10,85,35,'#24406e',.3]];
 for(const [x,y,r,c,o] of blobs)neb+=`<circle cx="${x}%" cy="${y}%" r="${r}%" fill="${c}" opacity="${o}" filter="url(#neb)"/>`;
 let st2='';for(let i=0;i<160;i++){const x=rnd()*100,y=rnd()*100,r=(Math.pow(rnd(),3)*1.6+.3).toFixed(2),o=(rnd()*.7+.2).toFixed(2),c=rnd()<.15?'#ffe2b8':rnd()<.2?'#bfe0ff':'#ffffff';st2+=`<circle class="${rnd()<.12?'tw':''}" style="animation-delay:-${(rnd()*3.6).toFixed(1)}s" cx="${x.toFixed(2)}%" cy="${y.toFixed(2)}%" r="${r}" fill="${c}" opacity="${o}"/>`}
 (function pixelSky(){const el=document.getElementById('sky');if(!el||typeof document.createElement!=='function')return;
 const draw=()=>{const W=Math.ceil(innerWidth/4),H=Math.ceil(innerHeight/4);const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');if(!g)return;
  let sd=7;const rn=()=>(sd=(sd*16807)%2147483647)/2147483647;const p=(x,y,col)=>{g.fillStyle=col;g.fillRect(x,y,1,1)};
  g.fillStyle='#10162b';g.fillRect(0,0,W,H);
  // dithered nebula bands
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=Math.sin(x*0.045+y*0.03)+Math.sin(y*0.06-x*0.02)*0.8;if(v>1.15&&(x+y)%2===0)p(x,y,'#1c2350');else if(v>1.45)p(x,y,'#232a5e');if(v<-1.35&&(x+y)%2===0)p(x,y,'#142a3a')}
  for(let k=0;k<W*H/55;k++){const x=rn()*W|0,y=rn()*H|0,b=rn();p(x,y,b>.93?'#fff4c8':b>.8?'#bcd0ff':'#5a6796')}
  for(let k=0;k<6;k++){const x=rn()*W|0,y=rn()*H|0;p(x,y,'#ffffff');p(x-1,y,'#7f8fc9');p(x+1,y,'#7f8fc9');p(x,y-1,'#7f8fc9');p(x,y+1,'#7f8fc9')}
  // pixel planet, dithered terminator
  const cx=W-22,cy=Math.round(H*0.8),r=16;
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=x*x+y*y;if(d>r*r)continue;const sh=(x+y*0.4)/r;let col=sh<-0.3?'#e0a070':sh<0.25?'#b8704a':'#6e3a2c';if(sh>0.25&&sh<0.45&&(x+y)%2)col='#b8704a';if(sh>0.6)col='#3c2025';if(Math.abs(y-x*0.25-3)<1.2)col=sh>0.25?'#5a3026':'#c9845a';p(cx+x,cy+y,col)}
  for(let x=-r-9;x<=r+9;x++){const y=Math.round(x*-0.28);const fx=cx+x,fy=cy+y+2;if(x*x+(y+2)*(y+2)<=r*r&&x>-3)continue;p(fx,fy,'#e8c27a');if(Math.abs(x)<r+5)p(fx,fy+1,'#a07a3a')}
  // small moon
  const mx=7,my=H-12;for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++)if(x*x+y*y<=17)p(mx+x,my+y,x+y>1?'#59627a':'#aab3c6');
  el.innerHTML='';el.appendChild(c)};
 draw();let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,200)})})();
})();

// Swap the font's slash-like sword glyph for a drawn pixel sword in all on-screen text.
(function(){const G='\u2694',R=/\u2694\uFE0F?/g;let busy=false;
 function fix(root){if(busy||!root)return;busy=true;try{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.includes(G)&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?1:3});const hit=[];let n;while(n=w.nextNode())hit.push(n);
  hit.forEach(t=>{const f=document.createDocumentFragment();t.nodeValue.split(R).forEach((part,i,a)=>{if(part)f.appendChild(document.createTextNode(part));if(i<a.length-1){const e=document.createElement('i');e.className='swd';e.setAttribute('role','img');e.setAttribute('aria-label','personal');f.appendChild(e)}});t.parentNode.replaceChild(f,t)})}finally{busy=false}}
 function go(){if(typeof NodeFilter==='undefined'||typeof MutationObserver==='undefined')return;const a=document.getElementById('app');if(!a)return;fix(a);new MutationObserver(()=>fix(a)).observe(a,{childList:true,subtree:true,characterData:true})}
 if(document.readyState==='loading')addEventListener('DOMContentLoaded',go);else go()})();
</script>
