<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Rule a star empire for twelve turns in this pixel-art sci-fi roleplay game.">
<meta name="theme-color" content="#070b16">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Star Sovereign II, 3rd Edition</title>
<style>
:root{--bg:#070b16;--panel:#111a2e;--line:#24324f;--text:#dbe4f5;--dim:#8494b3;--acc:#7cc4ff;--good:#6ee7a8;--bad:#ff7b8a;--warn:#ffc46b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#16224a 0%,var(--bg) 60%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:.04em}
h2{font-size:19px;margin:0 0 8px}
.sub{color:var(--dim);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{display:block;width:100%;text-align:left;background:#18233d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc);background:#1d2b4b}
button small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
button.personal{border-color:#5a4a2a}
button.lethal{border-color:#6b2a35}
.risk{display:block;font-size:13px;margin-top:4px;color:var(--warn)}
.lethal .risk{color:var(--bad);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 2px;text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.bar{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.turn{color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.result{border-left:3px solid var(--acc)}
.delta{font-size:14px;margin-top:8px}
.up{color:var(--good)}.down{color:var(--bad)}.warn{color:var(--warn)}
.log{font-size:13px;color:var(--dim);max-height:170px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px solid #1a2540}
.big{font-size:40px;text-align:center;margin:6px 0}
.rs{display:inline-block;width:auto;float:right;margin:4px 0 0 6px;padding:6px 12px;font-size:13px;text-align:center}
.rs-wrap{float:right}
.note{font-size:13px;color:var(--dim)}
.rec{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#132447,#0f1a30);border:1px solid #2e4677;border-radius:14px;padding:12px 16px;margin-bottom:12px}
.rec-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.rec-v{font-size:34px;font-weight:800;line-height:1.1}
.rec-r{text-align:right;font-size:14px}
.recl{display:block;margin-top:4px;color:var(--text)}
.diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.d-Easy{background:#123b2a;color:var(--good)}.d-Normal{background:#3b3212;color:var(--warn)}.d-Hard{background:#3b1220;color:var(--bad)}
.arena{position:relative;isolation:isolate;transform:translateZ(0);height:160px;margin:6px 0 10px;border-radius:10px;background:#050812;overflow:hidden;border:1px solid var(--line)}
.ship{position:absolute;left:18px;top:42px;width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:30px solid var(--acc);filter:drop-shadow(0 0 6px var(--acc))}

.beam{position:absolute;left:48px;top:54px;height:3px;width:0;background:#fff;box-shadow:0 0 10px var(--acc),0 0 4px #fff;animation:beam .5s .5s ease-out forwards}


.lose .ship{animation:die .6s 1.4s forwards}
@keyframes beam{to{width:calc(100% - 48px)}}

@keyframes swarm{to{left:var(--ex);top:var(--ey)}}
.lane{position:absolute;left:0;right:0;height:14px;transform:translate3d(-14%,0,0);will-change:transform;backface-visibility:hidden}
.ally{position:absolute;left:0;top:0;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:16px solid var(--c)}
.win .lane{animation:laneWin 2.2s ease-in forwards}
.lose .lane{animation:laneLose 2.6s ease-in-out forwards}
@keyframes laneWin{to{transform:translate3d(105%,0,0)}}
@keyframes laneLose{40%{transform:translate3d(20%,0,0);opacity:1}100%{transform:translate3d(-14%,0,0);opacity:0}}
.bullet{position:absolute;left:0;right:0;height:2px;opacity:0;will-change:transform;backface-visibility:hidden;animation:shoot .45s linear forwards}
.bullet::before{content:'';position:absolute;left:0;width:12px;height:2px;background:#fff}
@keyframes shoot{0%{transform:translate3d(48px,0,0);opacity:1}100%{transform:translate3d(100%,0,0);opacity:1}}
.sun{position:absolute;left:8px;top:30px;width:50px;height:50px;border-radius:50%;background:radial-gradient(#fff,#ffd36b 50%,#ff9a3c);box-shadow:0 0 20px #ffb347}
.win .sun{animation:charge .9s ease-in forwards}
.lose .sun{animation:fizzle 1.9s forwards}
@keyframes fizzle{0%{transform:scale(.8)}45%{transform:scale(1.25);box-shadow:0 0 45px #fff}55%{transform:scale(1.32)}66%{transform:scale(.62);box-shadow:0 0 4px #777}80%{transform:scale(.7)}100%{transform:scale(.6);filter:grayscale(1);opacity:.55}}
.pellet{position:absolute;left:58px;top:51px;width:8px;height:8px;border-radius:50%;background:#ffd400;box-shadow:0 0 8px #ffd400;opacity:0;animation:plop 1.2s 1s ease-in forwards}
@keyframes plop{0%{opacity:1;transform:translate(0,0)}35%{transform:translate(38px,-8px)}100%{opacity:1;transform:translate(64px,70px)}}
.quip{position:absolute;font-size:13px;font-style:italic;font-weight:600;opacity:0;animation:quip 1.1s forwards}
@keyframes quip{0%{opacity:0;transform:translateY(5px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.puff{position:absolute;left:22px;top:44px;width:22px;height:22px;border-radius:50%;background:#9aa3b5;opacity:0;animation:puff .9s 1.1s ease-out forwards}
@keyframes puff{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:translate(-6px,-34px) scale(2.2)}}
@keyframes charge{0%{transform:scale(.8)}80%{transform:scale(1.2);box-shadow:0 0 45px #fff}100%{transform:scale(1)}}
@keyframes flicker{0%,20%,40%{opacity:1}10%,30%{opacity:.25}60%{opacity:.8}100%{opacity:.25;filter:grayscale(1)}}
.bigbeam{position:absolute;left:52px;top:47px;height:16px;width:0;border-radius:8px;background:linear-gradient(#ffe9a8,#fff,#ffe9a8);box-shadow:0 0 18px #ffd36b;animation:beam .35s .9s ease-out forwards}
.suspense span{animation:blink 1.2s infinite}.suspense span:nth-child(2){animation-delay:.2s}.suspense span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.reveal{animation:rev .5s ease-out}
@keyframes rev{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.help{position:fixed;inset:0;background:rgba(3,6,14,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.help .card{max-width:520px;max-height:90vh;overflow:auto;margin:0}
.help ol,.help ul{padding-left:20px;margin:8px 0}.help li{margin:6px 0}
.boom{position:absolute;left:52px;top:51px;width:8px;height:8px;border-radius:50%;background:#ffd400;box-shadow:0 0 8px #ffd400;opacity:0;animation:boom 1.1s .55s ease-in-out forwards}
@keyframes boom{0%{opacity:1;transform:translate(0,0)}45%{opacity:1;transform:translate(95px,-24px)}92%{opacity:1;transform:translate(-8px,-2px)}100%{opacity:0;transform:translate(-8px,-2px)}}
.wob{position:absolute;inset:0;animation:wob .5s 1.62s}
@keyframes wob{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes die{to{opacity:0;transform:scale(.3) rotate(90deg);border-left-color:var(--bad)}}

/* ---------- deep-space theme ---------- */
:root{--bg:#0d1630;--panel:#152040;--panel2:#1b2a52;--line:#33507e;--text:#e4ecf7;--dim:#93a6c6;--acc:#9fd8ff;--good:#78d6b0;--bad:#ef7a6e;--warn:#f0c674;--ink:#070c1c;--boil:url(#b0)}
body{background:var(--bg);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--text)}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none}
.sky svg{width:100%;height:100%;display:block}
h1,h2,.turn,.stat b,.rec-v,.big,.diff,.logo{font-family:'Chakra Petch',system-ui,sans-serif}
h1{font-weight:700;letter-spacing:.01em}
h2{font-weight:600;font-size:21px;letter-spacing:.01em}
.logo{font-size:34px;line-height:1.05;color:var(--warn);margin:16px 0 10px;text-shadow:0 0 18px rgba(240,198,116,.25)}
.logo span{color:var(--text);font-weight:500}
.sub{color:var(--dim);text-shadow:0 1px 6px var(--bg)}
.card,button,.rec,.stat{position:relative}
.card,.rec{--c:14px;background:linear-gradient(180deg,rgba(27,42,82,.92),rgba(21,32,64,.92));border:0;border-radius:0;clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));box-shadow:none}
.card::before,.rec::before,button::before{content:'';position:absolute;inset:0;pointer-events:none;background:var(--line);filter:var(--boil);
 clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c),var(--c) 0,calc(var(--c) + .4px) 1.5px,1.5px calc(var(--c) + .4px),1.5px calc(100% - 1.5px),calc(100% - var(--c) - .4px) calc(100% - 1.5px),calc(100% - 1.5px) calc(100% - var(--c) - .4px),calc(100% - 1.5px) 1.5px,calc(var(--c) + .4px) 1.5px)}
button{--c:9px;background:rgba(13,22,48,.85);border:0;border-radius:0;clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));box-shadow:none;transition:background .15s}
button:hover{background:#1f3363;border-color:transparent}
button:active{background:#284174}
button:focus-visible{outline:2px solid var(--warn);outline-offset:3px}
button small{color:var(--dim)}
button.personal::before{background:var(--warn)}
button.lethal{background:rgba(64,22,34,.85)}
button.lethal::before{background:var(--bad)}
.rs{--c:6px}
.risk{color:var(--warn)}
.lethal .risk{color:#ff9d92}
.stats{gap:6px}
.stat{background:rgba(7,12,28,.7);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:8px 2px 6px;border-top:2px solid var(--acc)}
.stat b{font-size:23px;font-weight:600}
.stat span{text-transform:none;letter-spacing:.02em;font-size:12px;color:var(--dim)}
.pill{background:rgba(7,12,28,.55);border:1px solid var(--line);border-radius:3px}
.turn{text-transform:none;letter-spacing:.04em;font-size:14px;font-weight:600;color:var(--acc)}
.result{border-left:0}
.rec{--c:10px}
.rec::before{background:var(--warn);opacity:.7}
.rec-l{text-transform:none;letter-spacing:0;font-size:14px}
.rec-v{font-weight:700}
.diff{text-transform:none;letter-spacing:.03em;font-size:12px;font-weight:600;border-radius:2px;padding:1px 7px;background:transparent!important;border:1px solid currentColor}
.d-Easy{color:var(--good)!important}.d-Normal{color:var(--warn)!important}.d-Hard{color:var(--bad)!important}
.big{font-size:44px;font-weight:500}
.arena{background:radial-gradient(ellipse at 80% 40%,#1c1a3d 0%,#080d1f 70%);border:1px solid var(--line);border-radius:3px}

.log div{border-bottom:1px solid #1e2c52}
.help{background:rgba(5,9,22,.85)}

/* the Core Swarm */
.bug{position:absolute;width:0;height:0}
.bug i{position:absolute;width:var(--s);height:calc(var(--s)*.78);left:calc(var(--s)*-.5);top:calc(var(--s)*-.39);
 clip-path:polygon(0 50%,24% 28%,14% 2%,46% 22%,62% 0,74% 26%,100% 14%,86% 50%,100% 86%,74% 74%,62% 100%,46% 78%,14% 98%,24% 72%);
 background:radial-gradient(circle at 66% 50%,#ffcf9e 0 5%,#ff3d33 10%,#7a0f22 22%,#3c0814 45%,#16040a 80%);
 animation:skitter var(--j) ease-in-out var(--o) infinite alternate;will-change:transform}
@keyframes skitter{0%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(-2px,1.5px) rotate(4deg)}100%{transform:translate(1.5px,-1.5px) rotate(-2deg)}}
.win .bug{animation:burst .45s ease-in var(--d) forwards}
.win .bug i{animation:skitter var(--j) ease-in-out var(--o) infinite alternate,flash .45s var(--d) forwards}
@keyframes burst{0%{transform:scale(1)}45%{transform:scale(1.9)}100%{transform:scale(0);opacity:0}}
@keyframes flash{40%{background:#fff3e0}100%{background:#ffb08a}}
.lose .bug{animation:swarm 1.6s ease-in var(--d) forwards}
.maw{position:absolute;right:-70px;top:-40px;width:230px;height:190px;border-radius:50%;
 background:radial-gradient(closest-side,rgba(150,14,38,.55),rgba(70,4,22,.4) 45%,rgba(30,0,10,0) 100%);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.win .maw{animation:breathe 2.6s ease-in-out infinite,mawfade .8s var(--md) forwards}
@keyframes mawfade{to{opacity:0;transform:scale(.6)}}
.lose .maw{animation:breathe 1.4s ease-in-out infinite,mawpush 1.8s var(--md) ease-in forwards}
@keyframes mawpush{to{right:40%;opacity:1}}

.stage{position:absolute;left:0;right:0;top:25px;height:110px}
.ship{width:34px;height:24px;border:0!important;background:linear-gradient(90deg,#3e6aa3 0%,#9fd8ff 70%,#e9f7ff 100%);clip-path:polygon(0 4%,26% 30%,100% 50%,26% 70%,0 96%,14% 50%);filter:none!important;margin-top:-2px}
@keyframes die{60%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(.4) rotate(70deg)}}
.doom{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 55%,rgba(150,10,30,.55),rgba(60,0,15,.65));opacity:0;animation:doom 1.4s var(--dd) forwards}
@keyframes doom{to{opacity:1}}
.ember{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffb08a;opacity:0;animation:ember 2.6s var(--d) ease-out forwards}
@keyframes ember{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--vx),var(--vy))}}
.win.r-military .wob,.win.r-military .ship{animation:flyby 2.2s 1.9s ease-in-out forwards}
@keyframes flyby{0%{transform:translateX(0)}20%{transform:translateX(-6px)}100%{transform:translateX(150px)}}
.win.r-science .bigbeam{animation:beam .35s .9s ease-out forwards,afterglow 2.4s 1.5s ease-out forwards}
@keyframes afterglow{0%{opacity:1;height:16px;top:47px}100%{opacity:.18;height:4px;top:53px}}
.win.r-science .sun{animation:charge .9s ease-in forwards,glowpulse 1.6s 1.6s ease-in-out infinite}
@keyframes glowpulse{50%{box-shadow:0 0 34px #ffe6a8}}
.sky circle.tw{animation:tw 3.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.sky circle.tw,.bug i,.maw{animation:none}}

/* ---- DLC endings: the Thal ---- */
.thal{position:absolute;width:30px;height:18px;background:linear-gradient(90deg,#dfe8e2,#7f9e94 55%,#4f6b63);clip-path:polygon(0 50%,24% 0,100% 0,100% 100%,24% 100%)}
.thal::after{content:'';position:absolute;right:5px;top:6px;width:6px;height:6px;background:#2f4540}
.tshot,.yshot{position:absolute;width:10px;height:2px;opacity:0}
.tshot{background:#cfe7d8}.yshot{background:#fff}
@keyframes tfire{0%{left:var(--x0);opacity:1}100%{left:var(--x1);opacity:1}}
@keyframes fizz{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.shield{position:absolute;left:2px;top:-2px;width:66px;height:66px;margin-top:20px;border-radius:50%;border:2px solid #9fd8ff;box-shadow:inset 0 0 16px rgba(159,216,255,.6);opacity:0;animation:shieldOn .6s .2s forwards,shimmer 1.2s .8s ease-in-out infinite}
@keyframes shieldOn{to{opacity:1}}@keyframes shimmer{50%{box-shadow:inset 0 0 26px rgba(159,216,255,.9)}}
.flash{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(#fff,#9fd8ff 50%,transparent 70%);opacity:0;animation:pop1 .35s var(--d) forwards}
@keyframes pop1{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(2)}}
@keyframes powerdown{to{filter:grayscale(1) brightness(.6);transform:translateY(8px) rotate(10deg)}}
@keyframes backL{to{transform:translateX(-26px);opacity:.75}}
@keyframes backR{to{transform:translateX(30px);opacity:.75}}
@keyframes approach{to{transform:translateX(-70px)}}
@keyframes joinblue{to{transform:translateX(-70px);filter:sepia(1) hue-rotate(165deg) saturate(3.2) brightness(1.05)}}
.doc{position:absolute;width:12px;height:16px;background:#f4efe2;border-radius:1px;opacity:0;box-shadow:0 0 4px rgba(255,255,255,.4)}
.doc::after{content:'';position:absolute;left:2px;right:2px;top:4px;height:1px;background:#999;box-shadow:0 3px 0 #999,0 6px 0 #999}
@keyframes docmove{0%{left:var(--x0);top:var(--y0);opacity:1}100%{left:var(--x1);top:var(--y1);opacity:1}}
.stampmark{position:absolute;width:12px;height:12px;border:2px solid #e2574c;border-radius:50%;opacity:0;animation:stamp .25s var(--d) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
@keyframes shatter{0%{opacity:1}40%{filter:brightness(2.5)}100%{opacity:0;transform:scale(.4) rotate(40deg)}}
.sheet{position:absolute;width:10px;height:13px;background:#f4efe2;opacity:0;animation:flutter 2.4s var(--d) ease-out forwards}
@keyframes flutter{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:1}100%{opacity:.85;transform:translate(var(--vx),var(--vy)) rotate(var(--r))}}
@keyframes hit{0%,100%{filter:none}50%{filter:brightness(2.2)}}
.banner{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:-18px;font-size:12px;font-weight:700;color:#0d1630;background:var(--warn);padding:1px 8px;border-radius:2px;opacity:0;animation:stamp .3s var(--d) forwards;white-space:nowrap}
/* dlc v2 */
.half{position:absolute;width:6px;height:16px;background:#f4efe2;opacity:0;animation:tear 1.1s var(--d) ease-in forwards}
@keyframes tear{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--vx),40px) rotate(var(--r))}}
@keyframes redalert{to{filter:sepia(1) hue-rotate(-40deg) saturate(3)}}
@keyframes massing{to{filter:sepia(1) hue-rotate(-40deg) saturate(3);transform:translateX(-18px)}}
@keyframes arrive{to{left:var(--to)}}

.emp{position:absolute;left:36px;top:46px;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #bfe9ff;box-shadow:0 0 18px #9fd8ff,inset 0 0 12px #9fd8ff;opacity:0;animation:empwave 1.1s var(--d) ease-out forwards}
@keyframes empwave{0%{opacity:1;width:20px;height:20px;margin:-10px 0 0 -10px}80%{opacity:.85}100%{opacity:0;width:640px;height:640px;margin:-320px 0 0 -320px}}
.spark{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(#fff,#9fd8ff 40%,transparent 70%);opacity:0;animation:pop1 .3s var(--d) 3}
.kboom{position:absolute;width:var(--z,22px);height:var(--z,22px);margin:calc(var(--z,22px)/-2) 0 0 calc(var(--z,22px)/-2);border-radius:50%;background:radial-gradient(#fff 0 15%,#ffd27a 30%,#ff7a3d 55%,rgba(120,20,10,0) 72%);opacity:0;animation:kboom .55s var(--d) ease-out forwards}
@keyframes kboom{0%{opacity:1;transform:scale(.3)}60%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
.deb{position:absolute;width:4px;height:3px;background:#9fb0c6;opacity:0;animation:deb 1.2s var(--d) ease-out forwards}
@keyframes deb{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--vx),var(--vy)) rotate(260deg)}}
.dlcA .stage.shake{animation:shk .45s var(--d) 1}
@keyframes shk{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
@keyframes advance{to{transform:translateX(46px)}}
@keyframes advanceT{to{transform:translateX(-50px)}}
@keyframes kill{0%,100%{opacity:1}100%{opacity:0;transform:scale(.3) rotate(60deg)}}
@keyframes crack{0%,30%,60%{opacity:1}15%,45%{opacity:.25}100%{opacity:0;transform:scale(1.25)}}
@keyframes joinform{0%{left:var(--l0);top:var(--t0)}35%,55%{left:calc(var(--l0) - 60px);top:var(--t0);transform:none;filter:none}100%{left:var(--lx);top:var(--ly);transform:scaleX(-1);filter:sepia(1) hue-rotate(165deg) saturate(3.2) brightness(1.05)}}
.tdoom{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 55%,rgba(150,40,20,.5),rgba(20,30,28,.75));opacity:0;animation:doom 1.2s var(--d) forwards}
@media (prefers-reduced-motion:reduce){.dlcA *{animation-duration:.01s!important;animation-delay:0s!important}}
.pillflash{animation:pillflash 1.4s ease-out 2}
@keyframes pillflash{0%{box-shadow:0 0 0 0 rgba(240,198,116,.9);transform:scale(1.12)}100%{box-shadow:0 0 0 12px rgba(240,198,116,0);transform:scale(1)}}

.creator{text-align:center}
.bigport{width:192px;height:192px;image-rendering:pixelated;border:3px solid var(--line);display:block;margin:4px auto 12px;background:#1b2547}
.lrows{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.sticker{display:block;width:max-content;max-width:92%;position:relative;margin:2px 0 10px 2px;padding:4px 12px 6px;background:#f2ead8;color:#1a0f12;border:3px solid #0a1020;box-shadow:4px 4px 0 #0a1020;transform:rotate(-3deg);line-height:1.2}
.sticker .st-top{display:inline-flex;align-items:center;gap:5px;background:#b8323a;color:#fff;padding:0 6px;font-size:15px}
.sticker .st-top i{width:6px;height:6px;background:#fff;display:inline-block;animation:bnBlink 1.2s steps(1) infinite}
.sticker .st-main{display:block;font-size:22px;color:#b8323a;margin-top:3px}.sticker small{display:block;color:#4a3a40;font-size:14px;margin-top:1px}
.sticker::after{content:'';position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;background:linear-gradient(135deg,#cbbd9e 50%,#0a1020 50%)}
.sticker.rift{background:#1a0b2a;color:#e9dcff;border-color:#c77dff;box-shadow:4px 4px 0 #3b1a5c}.sticker.rift .st-top{background:#c77dff;color:#120818}.sticker.rift .st-top i{background:#120818}
.sticker.rift .st-main{color:#7df9ff}.sticker.rift small{color:#c9b8e8}.sticker.rift::after{background:linear-gradient(135deg,#3b1a5c 50%,#0a1020 50%)}
.sticker.slap{animation:stSlap .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stSlap{0%{transform:rotate(-16deg) scale(2);opacity:0}50%{opacity:1}100%{transform:rotate(-3deg) scale(1)}}
@media(prefers-reduced-motion:reduce){.sticker.slap,.sticker .st-top i{animation:none!important}}
.sysgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:3px 8px;margin:6px 0 8px;font-size:16px;align-items:center}.sysgrid>span{min-width:0;overflow-wrap:anywhere}.sysgrid .ubar{width:54px}
details.sec{border:2px solid #2c355c;margin:8px 0;padding:0 8px;background:rgba(10,16,32,.5)}details.sec>summary{cursor:pointer;padding:8px 0;color:#8fd3ff;font-size:19px;list-style:none}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::before{content:'▸ ';color:#ffd166}details.sec[open]>summary::before{content:'▾ '}details.sec[open]{padding-bottom:8px}
.trbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.trbtns .rs{float:none;margin:0}.warbtn{float:none!important;display:block;margin:8px 0 0}.ppanel::after{content:'';display:block;clear:both}
.warnban{border:3px solid #ffc857;background:rgba(60,40,8,.55);padding:8px 10px;margin:8px 0;border-radius:3px}.warnban b{color:#ffc857}.warnban p{margin:4px 0;font-size:17px}.warnban.lvl3{border-color:#ff5a5a;background:rgba(70,10,14,.6);animation:warnpulse 1.6s ease-in-out infinite}.warnban.lvl3 b{color:#ff7a6e}.warnban.lvl2{border-color:#ff9f43}@keyframes warnpulse{50%{border-color:#7a1f24}}@media (prefers-reduced-motion:reduce){.warnban.lvl3{animation:none}}
.evcard{border:3px solid #8fd3ff;background:rgba(10,24,48,.7);padding:8px 10px;margin:8px 0;border-radius:3px}.evcard.bad{border-color:#ef7a6e}.evcard h3{margin:0 0 4px}.evcard button{display:block;width:100%;margin-top:6px}
.genport{width:28px;height:28px;image-rendering:pixelated;border:2px solid var(--line);vertical-align:middle;margin-right:6px;background:#1b2547}
.sysport{width:64px;height:64px;image-rendering:pixelated;border:2px solid var(--line);float:left;margin:0 8px 4px 0;background:#1b2547}
.lrow{display:flex;align-items:center;justify-content:space-between;background:rgba(7,12,28,.55);border:1px solid var(--line);border-radius:3px;padding:4px}
.lrow .rs{float:none;margin:0;padding:4px 10px;font-size:16px}
.lrow span{font-size:14px;line-height:1.2}.lrow small{display:block;color:var(--dim);font-size:11px}
.hport{float:left;width:48px;height:48px;image-rendering:pixelated;border:2px solid var(--line);margin:2px 10px 6px 0;background:#1b2547}

.react{position:relative;width:96px;height:96px;margin:2px auto 10px}
.react img{width:96px;height:96px;image-rendering:pixelated;border:2px solid var(--line);display:block;background:#1b2547}
.react.good img{border-color:var(--good);animation:hop .5s ease-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) scale(1.05)}}
.react.good i{position:absolute;width:12px;height:12px;background:var(--warn);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:spk .9s ease-out forwards}
.react.good i:nth-of-type(1){left:-14px;top:10px;animation-delay:.1s}.react.good i:nth-of-type(2){right:-14px;top:0;animation-delay:.3s}.react.good i:nth-of-type(3){right:-8px;bottom:6px;animation-delay:.5s}
@keyframes spk{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.2) rotate(20deg)}100%{opacity:0;transform:scale(.6) rotate(45deg)}}
.react.bad img{border-color:var(--bad);animation:ouch .45s ease-in-out 2}
@keyframes ouch{20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.react.bad::after{content:'';position:absolute;inset:0;background:rgba(239,122,110,.6);opacity:0;animation:redflash .9s forwards;pointer-events:none}
@keyframes redflash{15%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.react *,.react::after{animation:none!important}}

:root{--bg:#10162b;--panel:#1c2645;--panel2:#243058;--edge:#070a16;--hi:#3d5185;--lo:#121935;--text:#ece4cc;--dim:#9aa3c4;--acc:#7fd0e0;--good:#86d38f;--bad:#e8665a;--warn:#f2b134;--line:#3d5185}
*{-webkit-font-smoothing:none;font-synthesis:none}
body,button,input{font-family:'SovereignPixel',monospace;font-size:20px;line-height:1.5;color:var(--text);letter-spacing:0}
body{background:var(--bg)}
h1,h2,.turn,.stat b,.rec-v,.big,.diff,.logo{font-family:'SovereignPixel',monospace;font-weight:normal}
b,strong{font-weight:normal;color:#fff}
h1{font-size:30px;line-height:1.3;text-shadow:3px 3px 0 var(--edge)}
h2{font-size:20px;color:var(--warn)}
.logo{font-size:40px;color:var(--warn);text-shadow:4px 4px 0 var(--edge);margin:18px 0 6px}
.logo span{color:var(--text)}
.sub{color:var(--dim);text-shadow:2px 2px 0 var(--edge)}
.note,.note *{font-size:20px;color:var(--dim)}
.card,.rec,button,.stat,.pill,.arena,.help .card{clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);border-radius:0!important}
.card::before,.rec::before,button::before{content:none!important}
.card,.rec{background:var(--panel);border:4px solid var(--edge);box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo);padding:16px}
button{background:#2a3767;border:4px solid var(--edge);box-shadow:inset 4px 4px 0 #4a5f9a,inset -4px -4px 0 #18214a;color:var(--text);transition:none;padding:10px 14px}
button:hover{background:#33437a}
button:active{transform:translateY(2px);box-shadow:inset 4px 4px 0 #18214a,inset -4px -4px 0 #4a5f9a}
button:focus-visible{outline:4px solid var(--warn);outline-offset:2px}
button small,button small *{font-size:20px;color:var(--dim)}
button.personal{background:#3a3424;box-shadow:inset 4px 4px 0 #8a6a22,inset -4px -4px 0 #241d0e}
button.lethal{background:#3e2228;box-shadow:inset 4px 4px 0 #9a3a32,inset -4px -4px 0 #24100f}
.risk{color:var(--warn)}.lethal .risk{color:#ff9a8c}
.rs{padding:4px 10px;font-size:20px}
.stats{gap:6px}
.stat{background:var(--panel2);border:4px solid var(--edge);border-top:4px solid var(--edge);box-shadow:inset 0 4px 0 var(--acc);padding:8px 2px 4px}
.stat b{font-size:30px;color:#fff}
.stat span{font-size:20px;color:var(--dim)}
.pill{background:var(--panel);border:4px solid var(--edge);padding:2px 8px}
.bar{gap:6px}
.turn{font-size:20px;color:var(--acc);letter-spacing:0}
.up{color:var(--good)}.down{color:var(--bad)}.warn{color:var(--warn)}
.rec::before{content:none}.rec-l{font-size:20px}.rec-v{font-size:40px}
.diff{font-size:20px;border:0;padding:0 6px;color:var(--edge)!important}
.d-Easy{background:var(--good)!important}.d-Normal{background:var(--warn)!important}.d-Hard{background:var(--bad)!important}
.arena{background:#0a0f22;border:4px solid var(--edge);box-shadow:inset 0 0 0 4px #1d2850}
.log{font-size:20px}.log div{border-bottom:4px solid var(--lo)}
.help{background:rgba(7,10,22,.88)}
.bigport,.hport,.react img{border:4px solid var(--edge)!important;box-shadow:inset 0 0 0 0 transparent}
.hport{width:56px;height:56px}
.lrow{background:var(--panel2);border:4px solid var(--edge);border-radius:0}
.lrow span,.lrow small{font-size:20px}
.banner,.quip{font-family:'SovereignPixel',monospace;font-size:20px;font-weight:normal}
.tap{font-size:20px;border-radius:0}
.sky canvas{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated}

.stat{padding:6px 0 4px}
.stat .ico{width:21px;height:21px;display:block;margin:0 auto 2px}
.stat b{font-size:30px;line-height:1.1}
.stat span{font-size:10px;line-height:1.2;display:block}
.pill,.bar,.risk,.delta,.log,.quip,.lrow small,.recl,.rec-r,.note{font-size:20px!important}
.risk{display:block;margin-top:4px}
.bar{display:flex;flex-wrap:wrap}
.pill{line-height:1.3}
.banner{font-size:20px;white-space:normal;max-width:92%;text-align:center}

/* pixel battle sprites */
.arena{background-color:#0a0f22;background-size:144px 120px;image-rendering:pixelated}
.arena .ship{width:33px;height:21px;background-color:transparent!important;background-size:100% 100%;image-rendering:pixelated;clip-path:none!important;filter:none!important;margin-top:-1px}
.arena .ally{width:22px;height:14px;border:0!important;background-size:100% 100%;image-rendering:pixelated;filter:none!important}
.arena .bug i{clip-path:none!important;background-color:transparent!important;background-size:100% 100%;image-rendering:pixelated;width:var(--s);height:calc(var(--s)*.78)}
.arena .thal{width:33px;height:18px;clip-path:none!important;background-color:transparent;background-size:100% 100%;image-rendering:pixelated}
.arena .thal::after{content:none}
.arena .kboom{background-color:transparent;background-size:100% 100%;image-rendering:pixelated;border-radius:0}
.arena .flash,.arena .spark{background-color:transparent;background-size:100% 100%;image-rendering:pixelated;border-radius:0;width:15px;height:15px}
.arena .sun{background-color:transparent;background-size:100% 100%;image-rendering:pixelated;border-radius:0;box-shadow:none;width:45px;height:45px}
.arena .shield{background-color:transparent;background-size:100% 100%;image-rendering:pixelated;border:0;border-radius:0;box-shadow:none}
.arena .emp{background-color:transparent;background-size:100% 100%;image-rendering:pixelated;border:0;border-radius:0;box-shadow:none}
.arena .maw{opacity:.75;background-color:transparent!important;background-size:100% 100%;image-rendering:pixelated;border-radius:0}
.arena .bigbeam{background:linear-gradient(#ffe9a8 0 25%,#fff 25% 75%,#ffe9a8 75%);border-radius:0;box-shadow:none}
.arena .ember,.arena .puff,.arena .pellet,.arena .boom{border-radius:0}
.arena .stampmark{border-radius:0}
.arena .doom{background:rgba(110,12,28,.55)}.arena .tdoom{background:rgba(70,16,20,.6)}
.arena .yshot,.arena .tshot,.arena .bullet::before{height:3px}
.arena *{animation-timing-function:steps(12,end)!important}
.logo .l1{display:block;font-size:30px;line-height:1.1;letter-spacing:0;color:var(--warn);text-shadow:3px 0 0 #b0571c,0 3px 0 #b0571c,3px 3px 0 var(--edge),6px 6px 0 var(--edge)}
.logo .l2{display:inline-block;margin-top:8px;padding:0 10px;font-size:30px;background:var(--warn);color:var(--edge);text-shadow:none;box-shadow:4px 4px 0 var(--edge)}
.card.result{background:#1f2a3e;box-shadow:inset 4px 4px 0 #5b6f4a,inset -4px -4px 0 #141c26}
.card .turn{display:inline-block;background:var(--edge);color:var(--acc);padding:0 8px;margin:-4px 0 8px -4px}

.hud{display:flex;gap:6px;margin:0 0 12px}
.hud .pill{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;padding:4px 4px}
.hud .ico,.eq .ico{width:14px;height:14px;display:inline-block;vertical-align:-2px}
.eq{line-height:1.8}.eq .ico{margin-right:2px}.eq .need{display:block;color:var(--dim)}
.logo .l1{display:inline}.logo .l2{display:inline-block;margin:0 0 0 6px;vertical-align:2px;font-size:20px;padding:0 8px}
.vig{display:block;width:100%;height:auto;aspect-ratio:80/28;image-rendering:pixelated;border:4px solid var(--edge);margin:4px 0 10px}
.lrows{grid-template-columns:1fr 1fr}.lrow:last-child{grid-column:1/-1}
.lrow .rs{padding:4px 6px}.lrow span{flex:1;padding:0 4px}

.topbar{display:flex;justify-content:flex-end;gap:6px;margin:6px 0 8px}.topbar .rs,.topbar .rs-wrap{float:none;margin:0}

function record(d,win){let r=REC[d];if(r.n>=10)r=REC[d]={w:0,n:0};r.n++;if(win)r.w++;saveRec()}

function resetRec(b){if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Tap again: reset and leave the scoreboard';setTimeout(()=>{if(document.body.contains(b)){delete b.dataset.armed;b.textContent='Reset win stats'}},3000);return}

// Win stats come from your latest 20 runs, the same runs the scoreboard counts.
function recOf(d){return ARCADE?lifeOfRuns(ARCADE.runs).main[d]:{w:0,n:0}}
function pct(d){const r=recOf(d);return r.n?Math.round(100*r.w/r.n):0}
function rcls(d){if(!recOf(d).n)return'';const p=pct(d),t=TARGET[d];return p>=t-5?'up':p>=t-25?'warn':'down'}
function recLine(d){const r=recOf(d),all=ARCADE?(ARCADE.runs||[]).length:0;
 const odds=`<span class="odds"><span>Skilled max: ~${TARGET[d]}%</span><span>Random: ~${RANDOM[d]}%</span></span>`;
 if(!r.n)return `<span class="recl">${odds}</span>`;return `<span class="recl">Your latest ${BOARD_KEEP} runs: <b class="${rcls(d)}">${pct(d)}%</b> (${r.w}/${r.n} here, ${all}/${BOARD_KEEP} runs in all)${odds}</span>`}
function recBox(d){const r=REC[d];const done=r.n>=10;
 return `<div class="rec"><div><div class="rec-l">${d}: ${done?'last 10 games':'current 10 games'}</div><div class="rec-v ${rcls(d)}">${r.n?pct(d)+'%':'—'}</div></div><div class="rec-r"><b>${r.w}</b> ${r.w===1?'win':'wins'} / <b>${r.n}</b> ${r.n===1?'game':'games'}<br><span class="note">Skilled play wins up to ~${TARGET[d]}%, ${done?'complete, resets next game':`next up: game ${r.n+1} of 10`}</span></div></div>`;
}

const HELP=`<h2>How to play</h2><ol>
<li><b>Goal:</b> survive 12 turns, then whatever comes for you at the end. You lose if you die or Stability hits 0.</li>
<li><b>Pick a main stat</b> (Fleet, Influence or Science, usually your empire's best) and raise it every turn. At the end, your power is that stat, plus half your Stability, a quarter of your Energy and half your Renown (rounded down), plus 0–3 luck, minus the Thal Threat penalty.</li>
<li><b>Get Stability to 6+ and hold it.</b> Energy drops by 1 every turn. Keep it above 0, because blackouts drain Stability.</li>
<li><b>⚔ means you go in person:</b> big rewards, real danger. Every button shows its odds.</li>
<li><b>Know your risk limit.</b> Take ⚔ choices up to about 8% death as a Veteran, 5% as a Survivor, or 15% as Daring (your close call covers one mistake). Playing Celest, stay at 5% or less. Skip ⚔ while Injured: it costs 1 Stability, then risks are ×1.5 for 3 turns.</li>
<li><b>Each ⚔ success earns 1 Renown.</b></li>
<li><b>Thal Threat rises every turn.</b> At the end it costs 1 power at 5+ and 3 at 8+. Lower it when it's cheap.</li>
<li><b>Win to unlock the DLC,</b> The Thal Reckoning: 10 more turns with your empire as it is, plus +4 Energy and +3 Stability. Buttons show which choices add progress for your route. Progress counts as power in the final move, which needs 34.</li>
<li><b>The end:</b> you will need about 16 power. When the moment comes, lead in person (+3) only if you are short.</li>
<li><b>Shop</b> (main menu): five consumables, each in tiers I to V, paid with credits. You can buy one of each item a day. Supply Drop (Energy and Stability), Field Medic (protects your next ⚔ choice; tier V means you can't die on it), Thal Bribe (lowers Threat), Lucky Star (final-battle luck) and Reinforcements (final-battle power; tier V adds 4 to 6). Use one item a turn from the Items button; not in the tutorial.</li>
<li><b>Timed</b> (on by default, the button next to Reset win stats): you get 30 seconds for every choice, and 20 for the very last decision (command from the rear or lead from the front; in the DLC, your final move). When time runs out, a choice is made at random and the next screen tells you which. Tutorial runs are never timed.</li>
</ol><h2>Credits for Systems multiplayer</h2><p class="note">Every finished run pays credits. Harder empires pay more.</p>

const SYS_RULES=`<h2>Systems multiplayer: rules</h2><ul>
<li><b>Servers.</b> Each server is its own galaxy, with up to 5 players and 3 AI empires. Servers made by the admin are marked (Main). Any player can run one server of their own; its creator or the admin can remove it, which wipes its galaxy. You play on one server at a time: moving to another abandons your system.</li>
<li><b>One week per game.</b> Every day is harder than the last. Your people need up to 25% more goods by day 7, bad events come more often and hit harder, and the AI empires build faster. On day 7 the Reflection comes. Then everything resets and you name a new system. Your technologies, ship upgrades and general carry over. Each new week starts harder: the AI empires and the Reflection grow 15% a week, plus 5% more for each player beyond the first.</li>
<li><b>Founding.</b> You pick your star and your home world. Stars: Yellow (no change), Red dwarf (bad events hit 15% softer, −1 Fuel an hour), Blue giant (+2 Fuel an hour, your people need 10% more Water), White dwarf (+2 Ore, −1 Food an hour). Home worlds: Temperate (+1 Food), Ocean (+2 Water, −1 Ore), Desert (+2 Ore, −1 Water), Volcanic (+2 Fuel, −1 Food), Jungle (+2 Food, −1 Fuel), all per hour. <b>New planet</b> abandons your system for good (worlds, goods, fleet, technologies, ship upgrades and general) so you can claim a new star. You keep your credits, and what you spent this week comes back.</li>
<li><b>AI empires never ally with players.</b> They still trade with you while their opinion of you is 0 or more. Players can ally with each other.</li>
<li><b>Credits needed today</b> is a guide: about what a steady player spends that day to keep their people fed and keep growing. It starts at 150 on day 1, then 300 on day 2 and 25 more each day, and 55 more a day each week. Prices were set to match, so main-game runs pay for most of it. Taxes pay part of it (2 credits an hour, 50% more each week, +1 for each development stage, +0.5 for each colony, +2 as Type II; halved during riots; none while your home world is occupied). Main-game runs pay the rest.</li>
<li><b>Your week's bank.</b> The header shows the credits you earned and spent in Systems this week. If you lose your system (New planet, moving to another server, your server being removed, an admin kicking you, or the server losing it), every credit you spent this week comes back. Credits you paid other players by investing don't. The bank starts fresh each week.</li>
<li><b>Your people</b> eat Food and Water, and later Ore, Fuel and foreign rare goods. They only settle when there is enough to spare. Each good you run short of adds 5 unrest an hour (3 for a rare good). At 60% unrest, riots halve your output.</li>
<li><b>The AI empires</b> invade at the start of day 3 (one empire) and day 5 (the others usually join), with a 12-hour warning. A player alone in the galaxy only faces the day-5 invasion, from one empire. A hostile empire also threatens you once your fleet reaches 80% of theirs, and strikes 2 hours later. It won't strike the same player again for 36 hours.</li>
<li><b>War runs in real time, even while everyone is away.</b> Fleets launch and meet halfway. The winner lands on the outer worlds first, moving inward, and besieges the home world last. Landings come in turns of 10 seconds: an undefended colony falls after one turn, and each defense level adds two more, with its guns firing on the fleet every turn. A home world is besieged with a dice roll every 30 seconds. While the whole defending side is away, the garrison digs in: a landing turn takes 10 minutes and a siege roll 90. Every landing turn and siege roll adds war exhaustion. AI home systems start fully fortified; their other worlds start with Orbital guns. Both sides see every siege, in the Sieges list and on the map.</li>
<li><b>Defending.</b> If you are attacked while you are away, your fleet never chases the enemy home. After a win it guards the world the enemy would hit next. If badly outmatched, it posts up over your home world instead. A battle over one of your worlds brings in its guns, and your fleet fights 10% harder on home ground. Online, you choose: counterattack or hold.</li>
<li><b>Vassals.</b> If an AI empire takes your home world, you become its vassal and play on, paying 1 Food, 1 Water and 1 of your rare good each hour. Another player frees you by winning the "Free their vassals" treaty, or by annexing or vassalizing your overlord.</li>
<li><b>The Reflection.</b> On day 7 every war stops and a rift opens for each player. Out of each comes a mirror of that player's fleet: the same ships and upgrades, at a strength set by the week, not by you. All players fight it together in one war. A mirror regrows every hour while its rift is open. Destroy a mirror's fleet to close its rift. Against the Reflection, your world's guns grow with your civilization: normal strength for a Landfall outpost, twice as strong at Type I, four times at Type II. Mirrors never occupy. They hover over your worlds and strike every siege turn, one world after another: a 50% chance to kill one of your people and a 25% chance to wreck a building (a works or a defense level), less over a defended world, until your people are down to 2. Your guns fire back each turn. Close every rift and every player whose people survived earns 2 free technology points. Close only your own and you earn 1. If the Reflection decimates your people, you earn none.</li>
<li><b>Investing.</b> From another player's panel (when you are not at war), offer to invest: they get a full day of every foreign rare good they need, and they pay you the credits you are still short of today's "credits needed" figure. It costs you no goods. Nothing happens unless they accept, and you can make one offer per player per day.</li>
<li><b>Rush orders.</b> Short of the Ore or Fuel for a warship? The shipyard builds it anyway, for double the credits and no goods.</li>
<li><b>Technologies</b> cost credits and goods, and you keep them forever: Closed-loop habitats, Deep-core mining, Hazard wardens, Drone shipyards, Bastion grid and Rift lances.</li>
<li><b>Your leader</b> rules at home. Leader types: Sovereign (no change), Steward (taxes +25%, each shortage +1 unrest), Industrialist (+1 Ore and +1 Fuel an hour, people need 10% more Food), Diplomat (trade routes with non-allies deliver in full, −1 Ore an hour), Zealot (unrest falls 2 faster when calm, taxes −20%).</li>
<li><b>Your general</b> leads your fleet. General types: Veteran (no change), Raider (+10% attack, −10% siege), Siegemaster (+20% siege, −5% attack), Warden (+15% attack over your own worlds, −5% attack elsewhere).</li>
<li><b>Renown.</b> Every main-game run earns renown (win 3 / 6 / 10 by difficulty, DLC win 5 / 9 / 14, a loss 1 to 3), and so does every battle, siege and conquest here. Spend it on general upgrades: Gunnery drills (+4% attack a level), Siege engineers (+8% siege), Evasive maneuvers (5% less damage from planetary guns); 10, 20 and 35 renown. Battle renown also earns promotions. Renown spent this week comes back with your credits if you lose your system.</li>
<li><b>Admin reset.</b> The admin can reset a server: it goes back to day 1 of the same week with no extra difficulty, and every system there is wiped, technologies, upgrades and generals included. Its players get back the credits and renown they spent there this week.</li></ul>`;

 if(E==='Kethari')for(let x=13;x<19;x++){px(x,21,OUT)}

 for(let y=0;y<24;y++)for(let x=0;x<32;x++)if(inHead(x+.5,y+.5)){

 if(E==='Celest')for(let y=0;y<24;y++)for(let x=0;x<32;x++)if(inHead(x+.5,y+.5)&&x<cx-rx*0.1&&y<cy-3&&(x+y)%5===0)px(x,y,'#ffffff'); // inner light

function showCreator(){
 if(!look||look.e!==EK())look=randLook();

}
function cycleLook(k,d){const o=optsFor(k);look[k]=o[(o.indexOf(look[k])+d+o.length)%o.length];showCreator()}

// Quantum suicide only appears when it is the only way left to win: even max luck (+3) and leading from the front (+3) fall short, but +10 and max luck would not.
function qOnlyHope(){const b=basePower(route),t=b.stat+b.stab+b.en+b.ren+(b.prog||0)-b.pen,need=dlc?NEED_DLC:NEED;return t+6<need&&t+13>=need}
// Narrative mode: each choice decides which kind of event comes next (Thal intrigue, the core, or home affairs).
function narrOn(){return false} // Narrative mode was removed
function narrToggle(){try{localStorage.setItem('ss2narr',narrOn()?'0':'1')}catch(e){}start();window.scrollTo(0,document.body.scrollHeight)}
function narrBranch(c){if(!narrOn()||dlc||turn>=TURNS)return;const fx=c.fx||{};
 const want=(fx.military>0||fx.threat)?'thal':fx.science>0?'core':'home';
 const used=new Set(deck.slice(0,turn).map(d=>d.t));const pool=[...EVENTS,...(EMP_EVENTS[EK()]||[])].filter(e=>!used.has(e.t));
 const pick=a=>a[Math.floor(Math.random()*a.length)];const tagged=pool.filter(e=>(ETAG[e.t]||'frontier')===want);
 const nxt=tagged.length?pick(tagged):pick(pool);if(nxt){const k=deck.indexOf(nxt);if(k>turn)deck[k]=deck[turn];deck[turn]=nxt}}

function evPending(){const s=SYS;if(!s||!s.sysName||!SYS_PID)return 0;if(!s.evAt){s.evAt=Date.now()-HOUR_MS;saveSys()}
 const n=Math.floor((Date.now()-s.evAt)/HOUR_MS);if(n>2){s.evAt=Date.now()-2*HOUR_MS;saveSys();return 2}return Math.max(0,n)}
function curEvent(){if(!evPending())return null;if(SYS.evNow==null||!SEV[SYS.evNow]){const good=Math.random()<goodOdds(),pool=SEV.map((e,i)=>i).filter(i=>!!SEV[i].g===good&&i!==SYS.evLast);SYS.evNow=pool[Math.floor(Math.random()*pool.length)];saveSys()}return SEV[SYS.evNow]}
function goodOdds(){return 0.7-HEAT.bad*heatAt(snow())}
// losses grow with the week and the season; gains don't
function hurtMult(){return (1+HEAT.hurt*heatAt(snow())+HEAT.hurtSeason*(SEASON.n-1))*(1-0.25*techLv('ward'))*(1-(sunOf(SYS).calm||0))}
function scaleFx(fx){const o={};for(const [k,n] of Object.entries(fx||{}))o[k]=n<0&&k!=='unrest'?Math.round(n*hurtMult()):k==='unrest'&&n>0?Math.round(n*hurtMult()):n;return o}
function applyFx(fx){for(const [k,n] of Object.entries(fx||{})){if(k==='unrest')SYS.unrest=Math.max(0,Math.min(100,SYS.unrest+n));else if(k==='pop')SYS.pop=Math.max(2,Math.min(housing(SYS),SYS.pop+n));else{const r=k==='spec'?SYS.spec:k;SYS.res[r]=Math.max(0,(SYS.res[r]||0)+n)}}}
function resolveEvent(i){const e=curEvent();if(!e)return null;const c=e.c[i],p=e.pirate&&c.p?pirateOdds(c):c.p,ok=!p||Math.random()<p,fx=scaleFx(ok?c.fx:c.ff);applyFx(fx);
 SYS.evAt+=HOUR_MS;SYS.evLast=SYS.evNow;SYS.evNow=null;return {e,c,ok,fx}}
function pirateOdds(c){return Math.min(.9,c.p+.03*fleetPower(myFleet()))}
// </sim-core>
function fxTxt(fx){return Object.entries(fx||{}).map(([k,n])=>k==='unrest'?`${n>0?'+':''}${n} unrest`:k==='pop'?`${n>0?'+':''}${n} people`:`${n>0?'+':''}${n} ${SRES_NAME[k==='spec'?SYS.spec:k]}`).join(', ')||'no loss'}
function eventCard(){const e=curEvent();if(!e)return '';const n=evPending();
 return `<div class="evcard${e.g?'':' bad'}"><h3>${escH(e.t)}</h3><p class="note">${escH(e.x)}${n>1?' <i>(1 more event waiting)</i>':''}</p>${e.c.map((c,i)=>{const p=e.pirate&&c.p?pirateOdds(c):c.p;
  return `<button onclick="pickSysEvent(${i})">${escH(c.l)}<small>${p?`${Math.round(p*100)}% chance: ${fxTxt(scaleFx(c.fx))}. Otherwise: ${fxTxt(scaleFx(c.ff))}.`:fxTxt(scaleFx(c.fx))+'.'}</small></button>`}).join('')}</div>`}
function pickSysEvent(i){const r=resolveEvent(i);if(!r)return;SYS_MSG=`${r.e.t}: ${r.ok?r.c.txt:r.c.ftxt} (${fxTxt(r.fx)})`;saveSys();renderSystems();sysSync()}

 put('.arena',spriteFn('astars',48,40,(x,y)=>{const h=(x*73+y*151)%97;return h===0?'#9aa6d0':h===7&&(x+y)%3===0?'#4a568a':null}));
 const st=document.createElement('style');st.textContent=css.join('\n');document.head.appendChild(st)}
if(typeof document.createElement==='function'&&document.head)sprites();
function embers(R){let e='';const t0={military:1.2,influence:2.8,science:1.5}[R];
 for(let i=0;i<16;i++){const l=55+Math.random()*40,t=10+Math.random()*90;e+=`<div class="ember" style="left:${l.toFixed(0)}%;top:${t.toFixed(0)}px;--d:${(t0+Math.random()*1.4).toFixed(2)}s;--vx:${(20+Math.random()*60).toFixed(0)}px;--vy:${(-30+Math.random()*50).toFixed(0)}px"></div>`}return e}
function arena(win,route){
 const R=route||'military';let fx='',delay;
 if(R==='military'){
  const sd=win?'':'animation-delay:3.9s;';
  fx=[20,64].map(t=>`<div class="ship" style="${sd}top:${t}px;transform:scale(.7)"></div>`).join('')+`<div class="wob"><div class="ship" style="${sd}"></div></div>`;
  if(!win)fx+=`<div class="boom"></div><div class="quip" style="left:20px;top:2px;color:#ffe9a8;animation-delay:0.2s">FIRE!</div><div class="quip" style="left:58px;top:30px;color:#ffe9a8;animation-delay:1.65s">...ow.</div>`;
  if(win)for(let i=0;i<9;i++)fx+=`<div class="bullet" style="top:${[33,55,77][i%3]}px;animation-delay:${(0.2+i*0.12).toFixed(2)}s"></div>`;
  delay=(i,l)=>0.55+i*0.07;
 }else if(R==='influence'){
  fx=`<div class="ship" style="${win?'':'animation-delay:3.5s'}"></div>`;
  if(!win)fx+=`<div class="quip" style="left:12px;bottom:4px;color:#ffe9a8;animation-delay:0.1s">Who's with me?!</div><div class="quip" style="left:96px;top:4px;color:#c58bff;animation-delay:1.05s">yeah...no</div><div class="banner" style="--d:2.7s;background:#ef7a6e">The galaxy refuses to unite</div>`;
  const cols=['#6ee7a8','#ffc46b','#c58bff','#ff9ad5','#7cc4ff','#9be7ff'];
  for(let i=0;i<6;i++)fx+=`<div class="lane" style="top:${8+i*16}px;animation-delay:${(i*(win?0.32:0.18)).toFixed(2)}s"><div class="ally c${i}" style="--c:${cols[i]}"></div></div>`;
  delay=(i,l)=>1.4+l/100*2.8;
  if(win)fx+=`<div class="banner" style="--d:5.4s">The united galaxy has triumphed</div>`;
 }else{
  fx=`<div class="sun"></div>${win?'<div class="bigbeam"></div>':'<div class="puff"></div><div class="pellet"></div><div class="quip" style="left:52px;top:14px;color:#ffe9a8;animation-delay:1s">pew.</div>'}`;
  delay=(i,l)=>1.15+i*0.03;
 }
 let bugs='',last=0;const N=24;const ld={military:2.4,influence:1.9,science:2.5}[R];
 for(let i=0;i<N;i++){const big=i<4,l=(big?76+Math.random()*16:48+Math.random()*48),t=(big?10+Math.random()*90:-18+Math.random()*146);
  const sz=big?(Math.random()<.5?27:36):18;
  const d=win?delay(i%14,l):ld+Math.random()*0.5;last=Math.max(last,d);
  bugs+=`<div class="bug" style="left:${l.toFixed(1)}%;top:${t.toFixed(0)}px;--s:${sz.toFixed(1)}px;--d:${d.toFixed(2)}s;--j:${(0.5+Math.random()*0.7).toFixed(2)}s;--o:-${(Math.random()).toFixed(2)}s;--ex:${(22+(Math.random()-.5)*46).toFixed(0)}px;--ey:${(48+(Math.random()-.5)*40).toFixed(0)}px"><i></i></div>`}
 const maw=`<div class="maw" style="--md:${win?(last+0.1).toFixed(2):ld.toFixed(2)}s"></div>`;
 fx=maw+fx;
 return `<div class="arena ${win?'win':'lose'} r-${R}"><div class="stage">${fx}${bugs}${win?embers(R):''}</div>${win?'':'<div class="doom" style="--dd:'+(ld+2.2).toFixed(2)+'s"></div>'}</div>`;
}

// DLC ending animations: your forces vs. the Thal
function arenaDLC(win,R){
 const TP=[[76,6],[86,26],[76,48],[86,70],[78,88]]; // Thal ship positions (left %, top px)
 const thal=(st='')=>TP.map(([l,t],i)=>`<div class="thal" style="left:${l}%;top:${t}px;${typeof st==='function'?st(i):st}"></div>`).join('');
 const quip=(txt,pos,col,d)=>`<div class="quip" style="${pos};color:${col};animation-delay:${d}s">${txt}</div>`;
 const boom=(l,t,d,z)=>`<div class="kboom" style="left:${l};top:${t}px;--d:${d}s;${z?`--z:${z}px`:''}"></div>`+Array.from({length:6},()=>`<div class="deb" style="left:${l};top:${t}px;--d:${d}s;--vx:${(-30+Math.random()*60).toFixed(0)}px;--vy:${(-30+Math.random()*60).toFixed(0)}px"></div>`).join('');
 const shot=(cls,t,x0,x1,d,dur=.45)=>`<div class="${cls}" style="top:${t}px;--x0:${x0};--x1:${x1};animation:tfire ${dur}s linear ${d.toFixed(2)}s forwards,fizz .1s ${(d+dur).toFixed(2)}s forwards"></div>`;
 let fx='',shake=null;
 if(R==='science'){
  if(win){
   fx+='<div class="ship"></div><div class="shield"></div>';
   fx+=thal(i=>`animation:powerdown 1.3s ${(2.5+i*0.08).toFixed(2)}s ease-in forwards`);
   for(let i=0;i<8;i++){const [l,t]=TP[i%5];const d=0.5+i*0.16;fx+=shot('tshot',t+8,l+'%','68px',d,.5)+`<div class="flash" style="left:62px;top:${t+3}px;--d:${(d+0.5).toFixed(2)}s"></div>`}
   fx+=`<div class="emp" style="--d:2.0s"></div><div class="emp" style="--d:2.25s"></div>`;
   fx+=TP.map(([l,t],i)=>`<div class="spark" style="left:${l}%;top:${t}px;--d:${(2.35+i*0.05).toFixed(2)}s"></div>`).join('');
   fx+=quip('EMP!','left:24px;top:-14px','#bfe9ff',2.0)+quip('...noted.','right:14px;bottom:-14px','#cfe7d8',3.2);
  }else{
   fx+='<div class="ship" style="animation:kill .5s 2.7s forwards"></div><div class="shield" style="animation:shieldOn .6s .2s forwards,crack 1.2s 1.2s forwards"></div>';
   fx+=thal('animation:advanceT 1.6s 3.0s ease-in-out forwards');
   for(let i=0;i<14;i++){const [l,t]=TP[i%5];const d=0.4+i*0.15;const x1=d<2.3?'68px':'26px';fx+=shot('tshot',t+8,l+'%',x1,d,.5)+`<div class="flash" style="left:${d<2.3?62:24}px;top:${t+3}px;--d:${(d+0.5).toFixed(2)}s"></div>`}
   fx+=boom('35px',42,2.7,46);shake=2.7;
   fx+=quip('Shield: reverse-engineered.','right:10px;bottom:-14px','#cfe7d8',3.3);
   fx+='<div class="tdoom" style="--d:3.4s"></div>';
  }
 }else if(R==='influence'){
  fx+='<div class="ship"></div>';
  if(win){
   const slots=[[54,10],[54,74],[92,24],[92,60],[130,42]];
   fx+=TP.map(([l,t],i)=>`<div class="thal" style="left:${l}%;top:${t}px;--l0:${l}%;--t0:${t}px;--lx:${slots[i][0]}px;--ly:${slots[i][1]}px;animation:joinform 3.6s ${(0.2+i*0.06).toFixed(2)}s ease-in-out forwards"></div>`).join('');
   fx+=`<div class="doc" style="--x0:62%;--y0:44px;--x1:58px;--y1:40px;animation:docmove .9s 1.4s ease-in-out forwards,fizz .3s 3.2s forwards"></div><div class="stampmark" style="left:58px;top:42px;--d:2.4s"></div>`;
   fx+=`<div class="banner" style="--d:6.2s">The Thal join your Federation</div>`;
  }else{
   // your charter is torn up and the Thal mobilize for war
   fx+=thal(i=>`animation:redalert .8s ${(2.0+i*0.08).toFixed(2)}s forwards,massing 1.6s ${(2.6+i*0.05).toFixed(2)}s ease-in-out forwards`);
   fx+=`<div class="doc" style="--x0:58px;--y0:40px;--x1:calc(70% - 4px);--y1:44px;animation:docmove .9s .4s ease-in-out forwards,fizz .01s 1.5s forwards"></div>`;
   fx+=`<div class="half" style="left:calc(70% - 4px);top:44px;--d:1.5s;--vx:-14px;--r:-40deg"></div><div class="half" style="left:calc(70% + 2px);top:44px;--d:1.5s;--vx:12px;--r:35deg"></div>`;
   for(let k=0;k<6;k++){const t=[16,38,60,82,27,71][k];fx+=`<div class="thal" style="left:105%;top:${t}px;filter:sepia(1) hue-rotate(-40deg) saturate(3);animation:arrive 1.2s ${(2.8+k*0.15).toFixed(2)}s ease-out forwards;--to:${(64+(k%2)*8)}%"></div>`}
   fx+=`<div class="banner" style="--d:3.2s;background:#ef7a6e">Mobilizing for war</div>`;
   fx+=quip('Clause 1: war.','right:10px;bottom:-14px','#ef7a6e',3.6);
   fx+='<div class="tdoom" style="--d:3.6s"></div>';
  }
 }else{
  const ys=[20,42,64];
  if(win){
   fx+=ys.map((t,i)=>`<div class="ship" style="top:${t}px;${i===1?'':'transform:scale(.7);'}animation:advance 1.4s 3.1s ease-in-out forwards"></div>`).join('');
   fx+=thal(i=>`animation:shatter .5s ${(1.0+i*0.32).toFixed(2)}s ease-in forwards`);
   fx+=`<div class="thal" style="left:88%;top:44px;transform:scale(1.7);animation:shatter .6s 2.75s ease-in forwards"></div>`;
   for(let i=0;i<6;i++){const t=ys[i%3]+10;fx+=shot('tshot',t,'76%','64px',0.25+i*0.22,.5)+`<div class="flash" style="left:58px;top:${t-5}px;--d:${(0.75+i*0.22).toFixed(2)}s"></div>`}
   for(let i=0;i<16;i++){const t=ys[i%3]+10;fx+=shot('yshot',t,'52px','84%',0.2+i*0.14)}
   TP.forEach(([l,t],i)=>{const d=(1.0+i*0.32);fx+=boom(l+'%',t+8,d.toFixed(2));for(let k=0;k<3;k++)fx+=`<div class="sheet" style="left:${l}%;top:${t}px;--d:${(d+0.3+k*0.1).toFixed(2)}s;--vx:${(-20+Math.random()*40).toFixed(0)}px;--vy:${(-30-Math.random()*30).toFixed(0)}px;--r:${(-90+Math.random()*180).toFixed(0)}deg"></div>`});
   fx+=boom('90%',52,'2.75',64);shake=2.75;
   for(let k=0;k<6;k++)fx+=`<div class="sheet" style="left:90%;top:48px;--d:${(2.9+k*0.06).toFixed(2)}s;--vx:${(-60+Math.random()*50).toFixed(0)}px;--vy:${(-40+Math.random()*80).toFixed(0)}px;--r:${(-180+Math.random()*360).toFixed(0)}deg"></div>`;
   fx+=quip('(their navy now exists on paper only)','right:8px;bottom:-14px','#f4efe2',3.4);
  }else{
   fx+=ys.map((t,i)=>`<div class="ship" style="top:${t}px;${i===1?'':'transform:scale(.7);'}animation:hit .25s ${(0.8+i*0.35).toFixed(2)}s 2,kill .5s ${[1.6,2.1,2.7][i]}s forwards"></div>`).join('');
   fx+=thal('animation:advanceT 1.6s 3.0s ease-in-out forwards');
   for(let i=0;i<16;i++){const t=ys[i%3]+10,d=0.2+i*0.15;fx+=shot('tshot',t,'76%','40px',d,.5)+`<div class="flash" style="left:34px;top:${t-5}px;--d:${(d+0.5).toFixed(2)}s"></div>`}
   for(let i=0;i<5;i++){const t=ys[i%3]+10;fx+=shot('yshot',t,'52px','76%',0.3+i*0.3)}
   fx+=boom('28px',24,'1.6')+boom('28px',68,'2.1')+boom('35px',46,'2.7',52);shake=2.7;
   fx+=quip('Account closed.','right:12px;bottom:-14px','#cfe7d8',3.3);
   fx+='<div class="tdoom" style="--d:3.3s"></div>';
  }
 }
 return `<div class="arena dlcA r-${R}"><div class="stage${shake?' shake':''}" ${shake?`style="--d:${shake}s"`:''}>${fx}</div></div>`;
}
// achievements at the end of a run
function achEnd(win,wasDlc,CR){const fin=LASTFIN;LASTFIN=null;if(TUT){ach('tut');return}if(!win)return;
 if(!wasDlc){ach('first');ach({Easy:'easy',Normal:'normal',Hard:'hard'}[emp.diff]);if(!RUNA.pc&&!(fin&&fin.front))ach('throne');const g=achGot();if(g.easy&&g.normal&&g.hard)ach('all3')}
 else{ach('dlc');if(CR&&CR.bonus){ach('chain');if(emp.diff==='Hard')ach('hardchain')}}
 if(RUNA.pc>=4&&!RUNA.pf)ach('flawless');if(RUNA.reboot)ach('reboot');if(aug)ach('aug');
 if(fin&&fin.q)ach('quantum');if(fin&&fin.p===fin.need)ach('razor')}
let lastDlc=false;
function replay(win){document.getElementById('arenaBox').innerHTML=lastDlc?arenaDLC(win,route):arena(win,route)}
const REVEAL={military:4800,influence:4400,science:4200};
let endToken=0;
function end(win,title,msg,fight){
 clearSave();
 const before=header();
 const wasDlc=dlc;let CR=null;if(!TUT){if(!wasDlc)record(emp.diff,win);lifeRecord(wasDlc,emp&&emp.diff,win);CR=awardCredits(wasDlc,emp&&emp.diff,win)}
 const unlock=win&&!wasDlc&&title==='Victory'&&!TUT;dlc=false;
 achEnd(win,wasDlc,CR);
 const dlcThreat=wasDlc?(win?0:10):null; // the campaign settles the Thal for good: 0/10 on a win, 10/10 on a loss
 const result=`<div class="stampban ${win?'sw':'sl'}">${title}</div><p>${msg}</p>${CR&&CR.n?`<p class="credline">+${CR.n} credits${CR.bonus?` and a +${CR.bonus} back-to-back bonus`:''} ${CR.r?` and +${CR.r} renown for your general`:''} for Systems. You now have ${credits()} credits${CR.r?` and ${renownPts()} renown`:''}.</p>`:''}${unlock?`<button class="personal" style="text-align:center" onclick="startDLC()">DLC: The Thal Reckoning<small>10 more turns to deal with the Thal for good, using your ${LABELS[route]}. Your empire carries over.</small>${dlcCredLine(emp.diff)}</button>`:''}${TUT?`<p class="note">Tutorial complete. Real runs are saved, count on the scoreboard and, after a victory, unlock the DLC.</p>`:''}<button style="text-align:center" onclick="start()">${TUT?'Play for real':'Play again'}</button>`;
 if(!fight){if(dlcThreat!==null)threat=dlcThreat;app.innerHTML=header()+(wasDlc||TUT?'':recBox(emp.diff))+`<div class="card" style="text-align:center">${result}</div>`+logBox();return}
 const tok=++endToken;
 app.innerHTML=`<div id="hdr">${before}</div><div class="card" style="text-align:center"><div id="arenaBox">${(lastDlc=wasDlc)?arenaDLC(win,route):arena(win,route)}</div><div id="resSlot"><p class="note suspense">The battle rages.</p></div></div><div id="recSlot"></div>`;
 setTimeout(()=>{if(tok!==endToken||!document.getElementById('resSlot'))return;
  if(dlcThreat!==null)threat=dlcThreat;
  document.getElementById('hdr').innerHTML=header();
  if(dlcThreat!==null){const pl=[...document.querySelectorAll('#hdr .pill')].find(x=>x.textContent.includes('Thal Threat'));if(pl)pl.classList.add('pillflash')}
  document.getElementById('recSlot').innerHTML=wasDlc||TUT?'':recBox(emp.diff);
  document.getElementById('resSlot').innerHTML=`<div class="reveal">${result}</div><button class="rs" style="float:none;margin:10px auto 0;display:block" onclick="replay(${win})">Replay battle</button>`;
  document.getElementById('recSlot').insertAdjacentHTML('afterend',logBox());
 },wasDlc?(win&&route==='influence'?7400:4800):(win&&route==='influence'?6800:(REVEAL[route]||2500)));
}

// hand-drawn sky + boiling outlines
(function(){
 let seed=42;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 let st='';for(let i=0;i<90;i++){const x=rnd()*100,y=rnd()*100,r=(rnd()*1.3+.4).toFixed(2),o=(rnd()*.6+.25).toFixed(2);st+=`<circle cx="${x.toFixed(1)}%" cy="${y.toFixed(1)}%" r="${r}" fill="#f2e8cf" opacity="${o}"/>`}
 let sp='';for(let i=0;i<7;i++){const x=rnd()*100,y=rnd()*100,k=(rnd()*4+3).toFixed(1);sp+=`<svg x="${x.toFixed(1)}%" y="${y.toFixed(1)}%" overflow="visible"><path d="M0 -${k} Q0 0 ${k} 0 Q0 0 0 ${k} Q0 0 -${k} 0 Q0 0 0 -${k}" fill="#f2b134" opacity=".8"/></svg>`}
 let neb='';const blobs=[[18,22,46,'#3a2a6e',.35],[78,30,40,'#1f5a6e',.28],[60,78,55,'#5b2a5e',.22],[10,85,35,'#24406e',.3]];
 for(const [x,y,r,c,o] of blobs)neb+=`<circle cx="${x}%" cy="${y}%" r="${r}%" fill="${c}" opacity="${o}" filter="url(#neb)"/>`;
 let st2='';for(let i=0;i<160;i++){const x=rnd()*100,y=rnd()*100,r=(Math.pow(rnd(),3)*1.6+.3).toFixed(2),o=(rnd()*.7+.2).toFixed(2),c=rnd()<.15?'#ffe2b8':rnd()<.2?'#bfe0ff':'#ffffff';st2+=`<circle class="${rnd()<.12?'tw':''}" style="animation-delay:-${(rnd()*3.6).toFixed(1)}s" cx="${x.toFixed(2)}%" cy="${y.toFixed(2)}%" r="${r}" fill="${c}" opacity="${o}"/>`}
 (function pixelSky(){const el=document.getElementById('sky');if(!el||typeof document.createElement!=='function')return;
 const draw=()=>{const W=Math.ceil(innerWidth/4),H=Math.ceil(innerHeight/4);const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');if(!g)return;
  let sd=7;const rn=()=>(sd=(sd*16807)%2147483647)/2147483647;const p=(x,y,col)=>{g.fillStyle=col;g.fillRect(x,y,1,1)};
  g.fillStyle='#10162b';g.fillRect(0,0,W,H);
  // dithered nebula bands
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=Math.sin(x*0.045+y*0.03)+Math.sin(y*0.06-x*0.02)*0.8;if(v>1.15&&(x+y)%2===0)p(x,y,'#1c2350');else if(v>1.45)p(x,y,'#232a5e');if(v<-1.35&&(x+y)%2===0)p(x,y,'#142a3a')}
  for(let k=0;k<W*H/55;k++){const x=rn()*W|0,y=rn()*H|0,b=rn();p(x,y,b>.93?'#fff4c8':b>.8?'#bcd0ff':'#5a6796')}
  for(let k=0;k<6;k++){const x=rn()*W|0,y=rn()*H|0;p(x,y,'#ffffff');p(x-1,y,'#7f8fc9');p(x+1,y,'#7f8fc9');p(x,y-1,'#7f8fc9');p(x,y+1,'#7f8fc9')}
  // pixel planet, dithered terminator
  const cx=W-22,cy=Math.round(H*0.8),r=16;
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=x*x+y*y;if(d>r*r)continue;const sh=(x+y*0.4)/r;let col=sh<-0.3?'#e0a070':sh<0.25?'#b8704a':'#6e3a2c';if(sh>0.25&&sh<0.45&&(x+y)%2)col='#b8704a';if(sh>0.6)col='#3c2025';if(Math.abs(y-x*0.25-3)<1.2)col=sh>0.25?'#5a3026':'#c9845a';p(cx+x,cy+y,col)}
  for(let x=-r-9;x<=r+9;x++){const y=Math.round(x*-0.28);const fx=cx+x,fy=cy+y+2;if(x*x+(y+2)*(y+2)<=r*r&&x>-3)continue;p(fx,fy,'#e8c27a');if(Math.abs(x)<r+5)p(fx,fy+1,'#a07a3a')}
  // small moon
  const mx=7,my=H-12;for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++)if(x*x+y*y<=17)p(mx+x,my+y,x+y>1?'#59627a':'#aab3c6');
  el.innerHTML='';el.appendChild(c)};
 draw();let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,200)})})();
})();
loadSave()?resume():start();
